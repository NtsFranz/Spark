<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Overlay</title>
<script defer src="/js/spark_websocket.js"></script>
<style>
	@font-face { font-family: 'GoodTimes'; src: url('/fonts/goodtimes.ttf') format('truetype'); }
	@font-face { font-family: 'Oxanium'; src: url('/fonts/Oxanium.ttf') format('truetype'); font-weight: 200 800; }

	:root {
		--orange: #ff8a1f;
		--orange-deep: #b44a00;
		--blue: #2fa8ff;
		--blue-deep: #0a4f9e;
		--ink: #eef4ff;
		--ink-dim: #8a97ad;
		--glass: rgba(8, 12, 22, 0.78);
		--glass-edge: rgba(255, 255, 255, 0.08);
		/* everything scales with the window: 16px at 1920 wide */
		font-size: calc(100vw / 120);
	}

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		width: 100vw;
		height: 100vh;
		overflow: hidden;
		background: transparent;
		color: var(--ink);
		font-family: 'Oxanium', 'Segoe UI', sans-serif;
		-webkit-font-smoothing: antialiased;
		user-select: none;
	}

	#root { position: absolute; inset: 0; transition: opacity .6s ease; }
	#root.offline { opacity: 0; }

	/* ───────────── SCOREBUG ───────────── */
	.scorebug {
		position: absolute;
		top: 1.4rem;
		left: 50%;
		transform: translateX(-50%);
		display: flex;
		align-items: stretch;
		filter: drop-shadow(0 .6rem 1.4rem rgba(0, 0, 0, .55));
	}

	.team {
		position: relative;
		display: flex;
		align-items: center;
		height: 4.2rem;
		width: 22rem;
		background: var(--glass);
		overflow: hidden;
	}
	.team.orange { clip-path: polygon(1.6rem 0, 100% 0, 100% 100%, 0 100%); justify-content: flex-end; }
	.team.blue   { clip-path: polygon(0 0, calc(100% - 1.6rem) 0, 100% 100%, 0 100%); justify-content: flex-start; }

	/* coloured wash behind each team */
	.team::before {
		content: '';
		position: absolute;
		inset: 0;
		opacity: .9;
	}
	.team.orange::before { background: linear-gradient(90deg, transparent 0%, rgba(255, 138, 31, .10) 40%, rgba(255, 138, 31, .45) 100%); }
	.team.blue::before   { background: linear-gradient(270deg, transparent 0%, rgba(47, 168, 255, .10) 40%, rgba(47, 168, 255, .45) 100%); }

	/* possession bar along the bottom edge */
	.team .poss {
		position: absolute;
		bottom: 0;
		height: .28rem;
		width: 100%;
		transform: scaleX(0);
		transition: transform .35s cubic-bezier(.2, .9, .3, 1);
	}
	.team.orange .poss { right: 0; transform-origin: right; background: linear-gradient(90deg, transparent, var(--orange)); box-shadow: 0 0 1rem var(--orange); }
	.team.blue .poss   { left: 0; transform-origin: left; background: linear-gradient(270deg, transparent, var(--blue)); box-shadow: 0 0 1rem var(--blue); }
	.team.has-disc .poss { transform: scaleX(1); }

	.team .name {
		position: relative;
		font-family: 'GoodTimes', sans-serif;
		font-size: 1.15rem;
		letter-spacing: .12em;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		max-width: 15rem;
		padding: 0 1.2rem;
		text-shadow: 0 0 .8rem rgba(0, 0, 0, .6);
	}

	.team .rounds {
		position: absolute;
		top: .55rem;
		display: flex;
		gap: .3rem;
	}
	.team.orange .rounds { right: 1.2rem; }
	.team.blue .rounds   { left: 1.2rem; }
	.rounds i {
		display: block;
		width: .9rem;
		height: .22rem;
		background: rgba(255, 255, 255, .18);
		transform: skewX(-30deg);
	}
	.team.orange .rounds i.won { background: var(--orange); box-shadow: 0 0 .5rem var(--orange); }
	.team.blue .rounds i.won   { background: var(--blue); box-shadow: 0 0 .5rem var(--blue); }

	.score {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: center;
		width: 5.4rem;
		height: 4.2rem;
		font-size: 3rem;
		font-weight: 800;
		font-variant-numeric: tabular-nums;
		line-height: 1;
	}
	.score.orange { background: linear-gradient(180deg, var(--orange) 0%, var(--orange-deep) 100%); }
	.score.blue   { background: linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%); }
	.score span { display: inline-block; text-shadow: 0 .15rem .6rem rgba(0, 0, 0, .35); }
	.score span.bump { animation: bump .7s cubic-bezier(.2, 1.6, .4, 1); }
	@keyframes bump {
		0%   { transform: scale(1.9); filter: brightness(2.5); }
		100% { transform: scale(1); filter: brightness(1); }
	}

	.center {
		position: relative;
		width: 10.5rem;
		height: 4.2rem;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		background: linear-gradient(180deg, rgba(14, 20, 34, .96), rgba(6, 9, 16, .96));
		border-left: 1px solid var(--glass-edge);
		border-right: 1px solid var(--glass-edge);
	}
	.clock {
		font-size: 2.15rem;
		font-weight: 700;
		letter-spacing: .04em;
		font-variant-numeric: tabular-nums;
		line-height: 1;
	}
	.clock.urgent { color: #ff4d5e; text-shadow: 0 0 1rem rgba(255, 77, 94, .6); }

	.status {
		position: absolute;
		top: 100%;
		left: 50%;
		transform: translateX(-50%);
		margin-top: .35rem;
		padding: .22rem .85rem .2rem;
		font-size: .72rem;
		font-weight: 700;
		letter-spacing: .28em;
		white-space: nowrap;
		background: var(--glass);
		clip-path: polygon(.5rem 0, calc(100% - .5rem) 0, 100% 100%, 0 100%);
		color: var(--ink-dim);
		transition: color .3s, background .3s;
	}
	.status.live { color: #fff; }
	.status.live::before {
		content: '';
		display: inline-block;
		width: .45rem;
		height: .45rem;
		margin-right: .5rem;
		border-radius: 50%;
		background: #ff3b4f;
		box-shadow: 0 0 .5rem #ff3b4f;
		vertical-align: .05rem;
		animation: pulse 1.4s ease-in-out infinite;
	}
	.status.alert { color: #111; background: #ffd23f; }
	@keyframes pulse { 50% { opacity: .25; } }

	/* ───────────── GOAL BANNER ───────────── */
	.goal {
		position: absolute;
		top: 9.5rem;
		left: 50%;
		width: 44rem;
		transform: translateX(-50%);
		pointer-events: none;
		opacity: 0;
		visibility: hidden;
	}
	.goal.show { visibility: visible; animation: goal-in .55s cubic-bezier(.15, .9, .25, 1) forwards; }
	.goal.hide { visibility: visible; animation: goal-out .45s ease-in forwards; }
	@keyframes goal-in {
		0%   { opacity: 0; transform: translateX(-50%) scaleX(.2) skewX(-20deg); }
		100% { opacity: 1; transform: translateX(-50%) scaleX(1) skewX(0); }
	}
	@keyframes goal-out {
		0%   { opacity: 1; transform: translateX(-50%); }
		100% { opacity: 0; transform: translateX(-50%) translateY(-1.5rem); }
	}

	.goal .bar {
		position: relative;
		overflow: hidden;
		padding: 1.1rem 2rem 1rem;
		text-align: center;
		clip-path: polygon(2rem 0, 100% 0, calc(100% - 2rem) 100%, 0 100%);
	}
	.goal.orange .bar { background: linear-gradient(90deg, var(--orange-deep), var(--orange) 50%, var(--orange-deep)); }
	.goal.blue .bar   { background: linear-gradient(90deg, var(--blue-deep), var(--blue) 50%, var(--blue-deep)); }
	/* light sweep */
	.goal .bar::after {
		content: '';
		position: absolute;
		top: 0;
		bottom: 0;
		width: 30%;
		left: -40%;
		background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent);
		transform: skewX(-20deg);
	}
	.goal.show .bar::after { animation: sweep 1.1s .25s ease-out; }
	@keyframes sweep { to { left: 120%; } }

	.goal .type {
		font-family: 'GoodTimes', sans-serif;
		font-size: 2.6rem;
		letter-spacing: .18em;
		line-height: 1;
		text-shadow: 0 .2rem 1rem rgba(0, 0, 0, .35);
	}
	.goal .who {
		margin-top: .45rem;
		font-size: 1.25rem;
		font-weight: 700;
		letter-spacing: .08em;
	}
	.goal .who .assist { opacity: .75; font-weight: 500; }
	.goal .stats {
		display: flex;
		justify-content: center;
		gap: .4rem;
		margin-top: .35rem;
	}
	.goal .stats div {
		padding: .4rem 1.1rem;
		background: var(--glass);
		font-size: .95rem;
		font-weight: 600;
		letter-spacing: .1em;
		font-variant-numeric: tabular-nums;
		clip-path: polygon(.5rem 0, 100% 0, calc(100% - .5rem) 100%, 0 100%);
	}
	.goal .stats b { font-size: 1.3rem; margin-right: .3rem; }

	/* ───────────── ROSTERS ───────────── */
	.roster {
		position: absolute;
		bottom: 2rem;
		width: 17rem;
		display: flex;
		flex-direction: column;
		gap: .25rem;
		filter: drop-shadow(0 .4rem 1rem rgba(0, 0, 0, .5));
	}
	.roster.orange { left: 1.6rem; }
	.roster.blue   { right: 1.6rem; }

	.player {
		position: relative;
		display: flex;
		align-items: center;
		height: 2.1rem;
		background: var(--glass);
		font-size: .95rem;
		font-weight: 600;
		transition: opacity .25s, transform .25s;
		animation: row-in .4s cubic-bezier(.2, .9, .3, 1);
	}
	@keyframes row-in { from { opacity: 0; transform: translateX(var(--from, -1rem)); } }
	.roster.blue .player { flex-direction: row-reverse; --from: 1rem; }

	.player .num {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 2.4rem;
		height: 100%;
		font-weight: 800;
		font-variant-numeric: tabular-nums;
	}
	.roster.orange .num { background: var(--orange); }
	.roster.blue .num   { background: var(--blue); }

	.player .pname {
		flex: 1;
		padding: 0 .7rem;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.roster.blue .pname { text-align: right; }

	.player .pts {
		width: 2.6rem;
		text-align: center;
		color: var(--ink-dim);
		font-variant-numeric: tabular-nums;
	}
	.player .pts.scored { color: var(--ink); }

	.player.stunned { opacity: .45; }
	.player.stunned .pname::after { content: ' ⚡'; }
	.player.disc { transform: translateX(.6rem); }
	.roster.blue .player.disc { transform: translateX(-.6rem); }
	.roster.orange .player.disc { box-shadow: inset -.22rem 0 0 var(--orange), 0 0 1.2rem rgba(255, 138, 31, .35); }
	.roster.blue .player.disc   { box-shadow: inset .22rem 0 0 var(--blue), 0 0 1.2rem rgba(47, 168, 255, .35); }

	/* ───────────── MINIMAP ───────────── */
	.map {
		position: absolute;
		bottom: 1.8rem;
		left: 50%;
		transform: translateX(-50%);
		width: 25rem;
		height: 10rem;
		filter: drop-shadow(0 .4rem 1rem rgba(0, 0, 0, .5));
	}
	.map svg { width: 100%; height: 100%; overflow: visible; }
	.map .dot { transition: transform .1s linear; }
	.map .speed {
		position: absolute;
		top: -1.5rem;
		left: 50%;
		transform: translateX(-50%);
		font-size: .8rem;
		font-weight: 700;
		letter-spacing: .2em;
		color: var(--ink-dim);
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
	}
	.map .speed b { color: var(--ink); font-size: 1rem; }

	/* ───────────── TIMEOUT / WAITING ───────────── */
	.timeout {
		position: absolute;
		top: 8.2rem;
		left: 50%;
		transform: translateX(-50%);
		padding: .7rem 2.4rem;
		font-family: 'GoodTimes', sans-serif;
		font-size: 1.5rem;
		letter-spacing: .25em;
		background: var(--glass);
		clip-path: polygon(1.5rem 0, 100% 0, calc(100% - 1.5rem) 100%, 0 100%);
		display: none;
	}
	.timeout small { display: block; margin-top: .3rem; font-family: 'Oxanium', sans-serif; font-size: .9rem; letter-spacing: .2em; color: var(--ink-dim); text-align: center; }
	.timeout.show { display: block; animation: goal-in .5s cubic-bezier(.15, .9, .25, 1) forwards; transform-origin: center; }

	#waiting {
		position: absolute;
		top: 1.4rem;
		left: 50%;
		transform: translateX(-50%);
		padding: .5rem 1.4rem;
		font-size: .8rem;
		letter-spacing: .25em;
		color: var(--ink-dim);
		background: var(--glass);
		opacity: 0;
		transition: opacity .6s;
	}
	#waiting.show { opacity: 1; }
</style>
</head>
<body>
<div id="waiting">WAITING FOR ECHO ARENA…</div>

<div id="root" class="offline">

	<div class="scorebug">
		<div class="team orange" id="teamOrange">
			<div class="rounds" id="roundsOrange"></div>
			<div class="name" id="nameOrange">ORANGE</div>
			<div class="poss"></div>
		</div>
		<div class="score orange"><span id="scoreOrange">0</span></div>
		<div class="center">
			<div class="clock" id="clock">--:--</div>
			<div class="status" id="status">—</div>
		</div>
		<div class="score blue"><span id="scoreBlue">0</span></div>
		<div class="team blue" id="teamBlue">
			<div class="name" id="nameBlue">BLUE</div>
			<div class="rounds" id="roundsBlue"></div>
			<div class="poss"></div>
		</div>
	</div>

	<div class="goal" id="goal">
		<div class="bar">
			<div class="type" id="goalType">GOAL</div>
			<div class="who" id="goalWho"></div>
		</div>
		<div class="stats">
			<div><b id="goalPts">2</b>PTS</div>
			<div><b id="goalSpeed">0.0</b>M/S</div>
			<div><b id="goalDist">0.0</b>M</div>
		</div>
	</div>


	<div class="roster orange" id="rosterOrange"></div>
	<div class="roster blue" id="rosterBlue"></div>

	<div class="map">
		<div class="speed">DISC <b id="discSpeed">0.0</b> M/S</div>
		<svg viewBox="-42 -18 84 36" preserveAspectRatio="xMidYMid meet">
			<defs>
				<linearGradient id="mapFill" x1="0" x2="1">
					<stop offset="0" stop-color="#ff8a1f" stop-opacity=".22"/>
					<stop offset=".5" stop-color="#0b1222" stop-opacity=".82"/>
					<stop offset="1" stop-color="#2fa8ff" stop-opacity=".22"/>
				</linearGradient>
				<filter id="glow" x="-1" y="-1" width="3" height="3">
					<feGaussianBlur stdDeviation=".8" result="b"/>
					<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
				</filter>
			</defs>
			<!-- arena outline: 80m long, 32m wide, chamfered ends -->
			<polygon points="-34,-16 34,-16 40,-8 40,8 34,16 -34,16 -40,8 -40,-8"
					 fill="url(#mapFill)" stroke="rgba(255,255,255,.28)" stroke-width=".35"/>
			<line x1="0" y1="-16" x2="0" y2="16" stroke="rgba(255,255,255,.25)" stroke-width=".3"/>
			<circle cx="0" cy="0" r="4" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".3"/>
			<line x1="-12" y1="-16" x2="-12" y2="16" stroke="rgba(255,255,255,.08)" stroke-width=".25"/>
			<line x1="12" y1="-16" x2="12" y2="16" stroke="rgba(255,255,255,.08)" stroke-width=".25"/>
			<!-- goals: orange defends the left end, blue the right -->
			<rect x="-40.6" y="-3" width="1.2" height="6" fill="#ff8a1f" filter="url(#glow)"/>
			<rect x="39.4" y="-3" width="1.2" height="6" fill="#2fa8ff" filter="url(#glow)"/>
			<g id="mapDots"></g>
		</svg>
	</div>
</div>

<script defer>
window.addEventListener('DOMContentLoaded', () => {
	const $ = id => document.getElementById(id);
	const STATUS = {
		pre_match: ['PRE-MATCH', ''],
		round_start: ['ROUND START', 'alert'],
		playing: ['LIVE', 'live'],
		score: ['GOAL', 'alert'],
		round_over: ['ROUND OVER', ''],
		post_match: ['FINAL', ''],
		pre_sudden_death: ['OVERTIME', 'alert'],
		sudden_death: ['OVERTIME', 'live'],
		post_sudden_death: ['FINAL', ''],
	};

	let lastFrameAt = 0;
	let lastScores = { o: null, b: null };
	let lastStatus = '';
	let goalTimer = null;
	let config = null;

	const text = (el, v) => { v = String(v); if (el.textContent !== v) el.textContent = v; };
	const pos = o => {
		const p = o && ((o.head && o.head.position) || o.position);
		return Array.isArray(p) && p.length >= 3 ? p : null;
	};
	const len = v => Array.isArray(v) ? Math.hypot(v[0] || 0, v[1] || 0, v[2] || 0) : 0;
	const clean = s => (s && s !== '[INVALID]') ? s : '';

	function setScore(el, val, key) {
		if (lastScores[key] !== null && val > lastScores[key]) {
			el.classList.remove('bump');
			void el.offsetWidth;
			el.classList.add('bump');
		}
		lastScores[key] = val;
		text(el, val);
	}

	function teamName(idx, fallback) {
		// overlay_config.teams is [blue, orange]
		const t = config && config.teams && config.teams[idx];
		const n = t && (t.team_name || t.vrml_team_name);
		return (n || fallback).toUpperCase();
	}

	function renderRounds(el, wins, total) {
		total = Math.max(0, Math.min(total || 0, 7));
		if (total <= 1) { el.innerHTML = ''; return; }
		let html = '';
		for (let i = 0; i < total; i++) html += `<i class="${i < wins ? 'won' : ''}"></i>`;
		if (el.innerHTML !== html) el.innerHTML = html;
	}

	function renderRoster(el, players) {
		const sorted = [...players].sort((a, b) => (a.number ?? 0) - (b.number ?? 0)).slice(0, 5);
		const keys = sorted.map(p => p.name || p.userid).join('|');
		if (el.dataset.keys !== keys) {
			el.dataset.keys = keys;
			el.innerHTML = sorted.map(() =>
				'<div class="player"><div class="num"></div><div class="pname"></div><div class="pts"></div></div>').join('');
		}
		sorted.forEach((p, i) => {
			const row = el.children[i];
			const pts = (p.stats && p.stats.points) || 0;
			text(row.children[0], String(p.number ?? 0).padStart(2, '0'));
			text(row.children[1], p.name || '');
			text(row.children[2], pts);
			row.children[2].classList.toggle('scored', pts > 0);
			row.classList.toggle('stunned', !!p.stunned);
			row.classList.toggle('disc', !!p.possession);
		});
	}

	function renderMap(frame, orange, blue) {
		// map space: x = -z (orange end on the left), y = x
		const dots = [];
		const add = (p, color, r, label) => {
			const q = pos(p);
			if (!q) return;
			dots.push({ x: -q[2], y: q[0], color, r, label });
		};
		orange.forEach(p => add(p, '#ff8a1f', 1.7, p.number));
		blue.forEach(p => add(p, '#2fa8ff', 1.7, p.number));
		if (frame.disc) add(frame.disc, '#ffffff', 1, null);

		const g = $('mapDots');
		if (g.childElementCount !== dots.length) {
			g.innerHTML = dots.map(d => d.label === null
				? `<g class="dot"><circle r="${d.r}" fill="#fff" filter="url(#glow)"/></g>`
				: `<g class="dot"><circle r="${d.r}" fill="${d.color}" stroke="rgba(0,0,0,.5)" stroke-width=".3"/>` +
				  `<text y=".55" text-anchor="middle" font-size="1.6" font-weight="800" fill="#fff" font-family="Oxanium"></text></g>`).join('');
		}
		dots.forEach((d, i) => {
			const node = g.children[i];
			node.setAttribute('transform', `translate(${Math.max(-40, Math.min(40, d.x)).toFixed(2)} ${Math.max(-16, Math.min(16, d.y)).toFixed(2)})`);
			const t = node.querySelector('text');
			if (t) text(t, d.label ?? '');
		});
	}

	function showGoal(frame) {
		const s = frame.last_score || {};
		const team = s.team === 'blue' ? 'blue' : 'orange';
		const g = $('goal');
		g.className = 'goal ' + team;
		text($('goalType'), (s.goal_type || 'GOAL').toUpperCase());
		const scorer = clean(s.person_scored);
		const assist = clean(s.assist_scored);
		$('goalWho').innerHTML = '';
		const who = document.createElement('span');
		who.textContent = scorer || teamName(team === 'blue' ? 0 : 1, team);
		$('goalWho').appendChild(who);
		if (assist) {
			const a = document.createElement('span');
			a.className = 'assist';
			a.textContent = '  ·  assist ' + assist;
			$('goalWho').appendChild(a);
		}
		text($('goalPts'), s.point_amount ?? 2);
		text($('goalSpeed'), (s.disc_speed || 0).toFixed(1));
		text($('goalDist'), (s.distance_thrown || 0).toFixed(1));
		void g.offsetWidth;
		g.classList.add('show');
		clearTimeout(goalTimer);
		goalTimer = setTimeout(hideGoal, 7000);
	}

	function hideGoal() {
		const g = $('goal');
		if (!g.classList.contains('show')) return;
		g.classList.remove('show');
		g.classList.add('hide');
	}

	function onFrame(frame) {
		if (!frame || !Array.isArray(frame.teams)) return;
		// arena only; combat and lobby frames are ignored
		if (frame.map_name && frame.map_name !== 'mpl_arena_a') { lastFrameAt = 0; return; }
		lastFrameAt = performance.now();

		const blue = (frame.teams[0] && frame.teams[0].players) || [];
		const orange = (frame.teams[1] && frame.teams[1].players) || [];

		// scorebug
		setScore($('scoreOrange'), frame.orange_points ?? 0, 'o');
		setScore($('scoreBlue'), frame.blue_points ?? 0, 'b');
		text($('nameOrange'), teamName(1, frame.teams[1] && frame.teams[1].team !== 'ORANGE TEAM' ? frame.teams[1].team : 'ORANGE'));
		text($('nameBlue'), teamName(0, frame.teams[0] && frame.teams[0].team !== 'BLUE TEAM' ? frame.teams[0].team : 'BLUE'));
		$('teamOrange').classList.toggle('has-disc', !!(frame.teams[1] && frame.teams[1].possession));
		$('teamBlue').classList.toggle('has-disc', !!(frame.teams[0] && frame.teams[0].possession));

		const total = frame.total_round_count || 0;
		const needed = Math.ceil(total / 2);
		renderRounds($('roundsOrange'), frame.orange_round_score || 0, needed);
		renderRounds($('roundsBlue'), frame.blue_round_score || 0, needed);

		// clock: MM:SS, with tenths in the last 10 seconds
		const t = Math.max(0, frame.game_clock || 0);
		const clock = $('clock');
		if (typeof frame.game_clock === 'number') {
			const m = Math.floor(t / 60), sec = Math.floor(t % 60);
			text(clock, t < 10 && t > 0
				? `${sec}.${Math.floor((t * 10) % 10)}`
				: `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`);
		} else {
			text(clock, (frame.game_clock_display || '--:--').split('.')[0]);
		}
		clock.classList.toggle('urgent', frame.game_status === 'playing' && t > 0 && t <= 30);

		// status pill / timeout
		const paused = frame.pause && frame.pause.paused_state && frame.pause.paused_state !== 'unpaused';
		const [label, cls] = paused ? ['TIMEOUT', 'alert'] : (STATUS[frame.game_status] || [String(frame.game_status || '').replace(/_/g, ' ').toUpperCase(), '']);
		const status = $('status');
		text(status, label || '—');
		status.className = 'status ' + cls;

		// goal banner
		if (frame.game_status === 'score' && lastStatus !== 'score') showGoal(frame);
		if (frame.game_status !== 'score' && lastStatus === 'score') setTimeout(hideGoal, 1500);
		lastStatus = frame.game_status;

		renderRoster($('rosterOrange'), orange);
		renderRoster($('rosterBlue'), blue);
		renderMap(frame, orange, blue);
		text($('discSpeed'), len(frame.disc && frame.disc.velocity).toFixed(1));
	}

	// hide everything when the game stops sending data
	setInterval(() => {
		const online = lastFrameAt && performance.now() - lastFrameAt < 3000;
		$('root').classList.toggle('offline', !online);
		$('waiting').classList.toggle('show', !online && new URLSearchParams(location.search).has('debug'));
	}, 500);

	const sw = new SparkWebsocket();
	sw.subscribe('frame_30hz', onFrame);
	sw.subscribe('overlay_config', c => { config = c; });
});
</script>
</body>
